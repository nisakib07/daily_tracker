# Keep this file's path unchanged: APP_BUILD_NUMBER comes from
# github.run_number, which is counted per workflow file. A renamed or new
# file restarts at 1, and installed apps would never see a newer build.
name: Build Android APK

on:
  workflow_dispatch: {}
  # Every branch runs the checks job. Other branches also build a web
  # preview and compile the Android app; only main goes on to build and
  # publish a release (see each job's `if`). This lets changes be tested on a branch without pushing an
  # update to installed apps.
  push:
    paths:
      - "mobile/**"
      - ".github/workflows/build-android.yml"

# Superseded branch runs are cancelled; main runs are allowed to finish so a
# release is never cut off halfway through publishing.
concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  checks:
    name: Format, analyze, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('mobile/pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pub-

      - name: Install dependencies
        run: flutter pub get

      - name: Format check
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  # Local Flutter builds are blocked on the main dev machine (Windows Smart
  # App Control rejects the SDK's unsigned impellerc.exe), so branch builds
  # of the web app are made here and served locally with
  # mobile/tool/preview_ci_web.py. Runs alongside checks, not after them, so
  # a preview is available even while a test is failing.
  web-preview:
    name: Build web preview
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('mobile/pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pub-

      - name: Install dependencies
        run: flutter pub get

      - name: Build web
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          flutter build web --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"

      - uses: actions/upload-artifact@v7
        with:
          name: money-master-web-preview
          path: mobile/build/web
          retention-days: 7

  # The dev machine has no Android SDK, so Kotlin/Gradle changes would
  # otherwise first be compiled by a release on main. A debug build needs no
  # signing secrets and catches those problems on the branch instead.
  android-check:
    name: Compile Android app
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('mobile/pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pub-

      - uses: gradle/actions/setup-gradle@v5

      - name: Install dependencies
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug

      # Exercises the apksigner lookup that the release job's certificate
      # check relies on, so a runner image change surfaces here first.
      - name: Read debug APK signature
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          "$apksigner" verify --print-certs build/app/outputs/flutter-apk/app-debug.apk | grep -i "certificate SHA-256 digest"

  release:
    name: Build and publish signed APK
    needs: checks
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('mobile/pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pub-

      # Pinned to v5, not v6: v6 moved caching into a closed-source component
      # whose separate Terms of Use are accepted by upgrading.
      - uses: gradle/actions/setup-gradle@v5

      - name: Install dependencies
        run: flutter pub get

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > android/upload-keystore.jks

      - name: Write key.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Build signed release APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            --dart-define=APP_BUILD_NUMBER="$GITHUB_RUN_NUMBER"

      # Android only installs an update signed with the same key as the app
      # already installed, and otherwise just says "App not installed". Build
      # 19 shipped with a stale keystore that way. Refuse to publish if the
      # signing certificate ever differs from the one Builds 24+ use.
      - name: Verify signing certificate
        env:
          EXPECTED_CERT_SHA256: c71da223101cc703663b862ea3c40bb36d8094ce62dbe30de5bc0ef2623bacdc
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          "$apksigner" verify --print-certs build/app/outputs/flutter-apk/app-release.apk | tee signers.txt
          grep -qi "certificate SHA-256 digest: $EXPECTED_CERT_SHA256" signers.txt || {
            echo "::error::APK is signed with an unexpected certificate; installed apps could not update to it."
            exit 1
          }

      - uses: actions/upload-artifact@v7
        with:
          name: money-master-release-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      # Published as a GitHub Release (not just a workflow artifact) so the
      # app itself can find it: AppUpdateChecker polls the GitHub Releases
      # API for a "build-N" tag newer than the running app's own build
      # number, embedded above via APP_BUILD_NUMBER. This is what lets the
      # app prompt "update available" instead of requiring a manual
      # rebuild-and-reinstall every time - there's no $25 Play Store
      # account behind this app, so this is the free equivalent.
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          make_latest: true
          files: mobile/build/app/outputs/flutter-apk/app-release.apk
